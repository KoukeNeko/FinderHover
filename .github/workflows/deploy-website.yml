name: Deploy Website to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/build-i18n.js'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Regenerate en/ja pages and stamp asset URLs with content hashes, so a
      # deploy never ships HTML that points at a stale cached stylesheet.
      - name: Build localized pages
        run: node scripts/build-i18n.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=finderhover
